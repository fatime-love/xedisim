<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fatiməm ❤️</title>

<style>

body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ff8fc4,#ffd6ea);
overflow:hidden;
font-family:Arial;
}

.card{

background:white;

padding:40px;

border-radius:30px;

text-align:center;

box-shadow:0 0 35px hotpink;

}

h1{

font-size:42px;

color:#ff1493;

}

p{

font-size:22px;

color:#ff4fa3;

}

.heart{

font-size:120px;

animation:beat 1s infinite;

}

@keyframes beat{

0%{transform:scale(1);}

50%{transform:scale(1.2);}

100%{transform:scale(1);}

}

</style>

</head>

<body>

<div class="card">

<div class="heart">🩷</div>

<h1>Səni sevirəm Fatiməm ❤️</h1>

<p>Sən mənim üçün çox dəyərlisən 💕</p>

</div>

</body>

</html>
